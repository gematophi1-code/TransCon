<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TransCon — конвертер файлов</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main>
        <h1>TransCon</h1>
        <p>Конвертер картинок и документов</p>
        <form action="/convert" method="post" enctype="multipart/form-data">
            <div>
                <label for="file">Файл</label>
                <input type="file" id="file" name="file" required>
            </div>
            <div>
                <label for="target_format">Сконвертировать в</label>
                <select id="target_format" name="target_format" required disabled>
                    <option value="">сначала выбери файл</option>
                </select>
            </div>
            <button type="submit">Конвертировать</button>
        </form>
    </main>
    <script src="/static/script.js"></script>
</body>
</html>
