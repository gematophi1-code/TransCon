<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TransCon — конвертер файлов</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="shell">
        <canvas id="rain" class="rain"></canvas>
        <div class="glow"></div>

        <div class="shell-inner">
            <header class="topbar">
                <div class="brand">
                    <span class="dot"></span>
                    <span class="brand-name">TRANSCON</span>
                </div>
                <div class="topbar-meta">
                    <span>img · txt · pdf</span>
                    <span class="accent">max 20 MB</span>
                </div>
            </header>

            <div class="body">
                <form class="pane" action="/convert" method="post" enctype="multipart/form-data" id="convert-form">
                    <div class="intro">
                        <h1>Конвертер файлов</h1>
                        <p>Картинки и документы. Ничего лишнего <span class="caret"></span></p>
                    </div>

                    <label class="drop" id="drop">
                        <input type="file" id="file" name="file" required>
                        <span class="drop-title" id="drop-title">переместите файл сюда</span>
                        <span class="drop-hint" id="drop-hint">или нажмите, чтобы выбрать — до 20 МБ</span>
                        <span class="sweep"></span>
                    </label>

                    <div class="field">
                        <span class="eyebrow">Сконвертировать в</span>
                        <div class="chips" id="chips"></div>
                        <p class="empty" id="empty">сначала выберите файл</p>
                        <input type="hidden" name="target_format" id="target_format">
                    </div>

                    <button type="submit" id="submit" disabled>Конвертировать</button>
                </form>

                <aside class="side">
                    <div class="block">
                        <span class="eyebrow">Поддержка</span>
                        <div class="support">
                            <div><span>jpeg png gif</span><span class="mute">↔</span></div>
                            <div><span>bmp webp</span><span class="mute">↔</span></div>
                            <div><span>txt</span><span class="accent">→ pdf</span></div>
                            <div><span>pdf</span><span class="accent">→ txt</span></div>
                        </div>
                    </div>
                </aside>
            </div>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
